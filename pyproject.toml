[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scale-tta"
version = "0.1.0"
description = "Training-free success-conditioned latent ensemble adaptation"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[tool.setuptools.packages.find]
include = ["scale_tta*"]
